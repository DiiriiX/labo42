name: Rappel quotidien
on:
  schedule:
    - cron: "34 18 * * *"
  workflow_dispatch:
jobs:
  rappeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node push/send.js
        env:
          RAPPEL: "1"
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
